[project]
name = "prnt"
version = "0.1.0"
description = ""
authors = [
    {name = "gregsyu",email = "greg3@tutamail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pillow (>=12.1.1,<13.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "rich (>=14.3.3,<15.0.0)",
    "numpy (>=1.26.0,<2.0.0)",
    "typer (>=0.24.1,<0.25.0)",
]

[tool.pyright]
typeCheckingMode = "off"

[tool.poetry]
packages = [{include = "prnt", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]
